name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    name: XeLaTeX build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2
      - name: LaTeX compilation
        uses: dante-ev/latex-action@2021-A
        with:
          root_file: cv.tex
          compiler: xelatex
          # args: -latexoption=-file-line-error -latexoption=-interaction=nonstopmode
          # optional, default is -pdf -latexoption=-file-line-error -latexoption=-interaction=nonstopmode
          # Install extra packages by apt-get
          # extra_system_packages: # optional
      - name: Save PDF
        uses: actions/upload-artifact@v3
        with:
          name: pdf
          path: cv.pdf
          
  create_release:
    name: Github Release
    needs: build_latex
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up tag
        id: tag
        run: |
            NEW_TAG=$(date +'%Y.%m.%d')
            LAST_TAG=$(git tag --sort=creatordate | tr '\n' ' ' | sed -e "s/ $NEW_TAG //" | tr ' ' '\n | tail -1')
            CHANGELOG=$(git log --pretty='format:- %s' $LAST_TAG..HEAD)

            # Multilines escape
            CHANGELOG="${CHANGELOG//'%'/'%25'}"
            CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
            CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

            echo ::set-env name=RELEASE_TAG::"$NEW_TAG"
            echo ::set-env name=RELEASE_NAME::"$(date +'%Y/%m/%d') - Curriculum Vitae"
            echo ::set-env name=RELEASE_BODY::"$CHANGELOG"
            echo ::set-env name=RELEASE_PDF::"$(date +'%Y')-${FILENAME}.pdf"

      - name: Retreive PDF
        uses: actions/download-artifact@v3
        with:
          name: pdf

      - name: Publish release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: ${{ env.RELEASE_PDF }}:output.pdf
          allow_override: true
